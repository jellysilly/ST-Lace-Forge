name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        run: git diff --exit-code --stat -- dist || (echo "::error::dist/ is out of date - run npm run build and commit it" && exit 1)
